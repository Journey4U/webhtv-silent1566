plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream {
        localProps.load(it)
    }
}
def hasReleaseSigning = localProps['storeFile'] && localProps['keyAlias'] && localProps['storePassword']
def releaseKeyPassword = localProps['keyPassword'] ?: localProps['storePassword']
def fastRelease = (project.findProperty('fastRelease') ?: 'false').toString().toBoolean()
def buildTimestamp = new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('Asia/Shanghai'))
def buildTime = fastRelease ? "fast-${buildTimestamp}" : buildTimestamp
def releaseTag = (System.getenv('WEBHTV_RELEASE_TAG') ?: '').replace('\\', '\\\\').replace('"', '\\"')
def apkSuffix = (System.getenv('WEBHTV_APK_SUFFIX') ?: '').replaceAll('[^A-Za-z0-9._-]', '')
def gitRevision = 'unavailable'
def gitState = 'unavailable'
def mpvSourceLock = new groovy.json.JsonSlurper().parse(rootProject.file('third_party/mpv-native-lock.json'))
def mpvSourceRevisions = ['mpv', 'ffmpeg', 'libplacebo'].collect { name -> "${name}=${mpvSourceLock.sources[name].commit}" }.join(' ') + " framework=${mpvSourceLock.builder.commit}"
try {
    def revision = providers.exec { workingDir rootDir; commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
    if (revision ==~ /[0-9a-f]{40}/) {
        gitRevision = revision
        gitState = providers.exec { workingDir rootDir; commandLine 'git', 'status', '--porcelain', '--untracked-files=no' }.standardOutput.asText.get().trim().isEmpty() ? 'clean' : 'dirty'
    }
} catch (Exception ignored) { /* Source archives may not contain Git metadata. */ }

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.silent.android.webhtv"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 560
        versionName "5.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "BUILD_TAG", "\"${releaseTag}\""
        buildConfigField "String", "GIT_REVISION", "\"${gitRevision}\""
        buildConfigField "String", "GIT_STATE", "\"${gitState}\""
        buildConfigField "String", "MPV_NATIVE_SOURCES", "\"${mpvSourceRevisions}\""
        buildConfigField "String", "MEDIA3_VERSION", "\"${libs.versions.media3.get()}\""
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-26"
                cppFlags "-std=c++20", "-Wall", "-Wextra", "-Werror=return-type"
            }
        }
    }

    flavorDimensions = ["mode", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    // MPV is delivered as an installable runtime module (see docs/PLG1-playback-core-plugin-architecture.md).
    //
    // The bundled copy is transitional. Excluding it by default removes ~37 MB of native libraries
    // that most installs never load; users who want the engine install the module instead, and
    // PlayerSetting.isMpvAvailable() already hides the kernel when neither source exists.
    //
    // Pass -PmpvBundle=true to restore the previous self-contained build. That switch is the
    // rollback path and must keep working.
    def mpvBundle = (project.findProperty('mpvBundle') ?: 'false').toString().toBoolean()

    // ASS rendering is part of normal builds; package the matching prebuilt ABI.
    sourceSets.main.jniLibs.srcDir(rootProject.file('third_party/exo-ass-native/prebuilt'))
    sourceSets.androidTest.assets.srcDir(files("$projectDir/schemas").files)

    // Drop the bundled MPV libraries unless -PmpvBundle=true was passed.
    //
    // Uses ignoreAssetsPatterns.add() rather than += : the property is a read-only ListProperty on
    // AGP 9.x, so Groovy's get-then-set form fails with "Cannot set the value of read-only
    // property". Mutating the list in place is the supported path.
    if (!mpvBundle) {
        androidResources.ignoreAssetsPatterns.add('mpv-libs')
    }

    // IJK is delivered as an installable runtime module too.
    //
    // Its libraries live in the shared jniLibs source set, so they are excluded from packaging
    // rather than from assets. PlayerSetting.isIjkAvailable() already hides the kernel when
    // neither source exists, and RuntimeIjk installs a resolver so a module-delivered copy is
    // found despite IJK loading by bare name.
    //
    // Pass -PijkBundle=true to restore the previous self-contained build.
    def ijkBundle = (project.findProperty('ijkBundle') ?: 'false').toString().toBoolean()
    if (!ijkBundle) {
        // add() rather than += : on AGP 9.x the collection is a read-only ListProperty, so the
        // get-then-set form fails with "Cannot set the value of read-only property".
        packaging.jniLibs.excludes.add('**/libijkffmpeg.so')
        packaging.jniLibs.excludes.add('**/libijksdl.so')
        packaging.jniLibs.excludes.add('**/libijkplayer.so')
    }

    // The realtime-subtitle engine (sherpa-onnx) is delivered as an installable runtime module too.
    //
    // RuntimeSherpa points the SDK at the module via the sherpa_onnx.native.path property, and
    // reports the feature unavailable when neither source exists, so removing the bundled copy
    // degrades the feature rather than breaking the app.
    //
    // Pass -PsherpaBundle=true to restore the previous self-contained build.
    def sherpaBundle = (project.findProperty('sherpaBundle') ?: 'false').toString().toBoolean()
    if (!sherpaBundle) {
        packaging.jniLibs.excludes.add('**/libsherpa-onnx-jni.so')
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(localProps['storeFile'])
                keyAlias localProps['keyAlias']
                keyPassword releaseKeyPassword
                storePassword localProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = !fastRelease
            shrinkResources = !fastRelease
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
            eachDependency { details ->
                if (details.requested.group == 'androidx.media3') {
                    details.useVersion(libs.versions.media3.get())
                    details.because('Use bundled Media3 build with MediaTitle and danmaku APIs')
                }
            }
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds = !fastRelease
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def flavors = variant.productFlavors.collectEntries { [(it.first): it.second] }
        def mode = flavors['mode'] ?: 'mode'
        def abi = flavors['abi'] ?: 'abi'
        variant.outputs.each { output ->
            output.outputFileName.set("${mode}-${abi}${apkSuffix}.apk")
        }
    }

    // Drop the forcetech P2P engine asset from arm64 builds only.
    //
    // The forcetech AAR ships two different libraries under one name. The 54 KB
    // jni/armeabi-v7a/libmitv.so is a loader: it reads <cacheDir>/libmitv.so, which the vendor
    // service com.gsoft.mitv.MainActivity.checkLibrary() has just copied out of assets, and then
    // calls System.load on it. The 3.7 MB assets/libmitv.so is the engine that loader loads
    // (soname libforcetv.so, exporting Java_com_forcetech_android_ForceTV_start/stop).
    //
    // The arm64 flavor's abiFilters removes the loader, so nothing in that build can reach the
    // engine: the extractor's three bare-name lookups (p2p, p3p, mitv) all fail and the asset is
    // never mapped. Dropping it there loses no capability. The v7a build keeps both files, because
    // there the loader is present and the asset is what it loads.
    //
    // Scoped through the variant API because ignoreAssetsPatterns is not a ProductFlavor property:
    // writing androidResources { } inside a productFlavors block falls through to the android-level
    // block and applies to every variant, which would silently break v7a.
    onVariants(selector().all()) { variant ->
        def abi = variant.productFlavors.find { it.first == 'abi' }?.second
        if (abi == 'arm64_v8a') {
            variant.androidResources.ignoreAssetsPatterns.add('libmitv.so')
        }
    }
}

